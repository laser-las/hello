; ---------------------------------------------------------------------------
; halcyon - extern klient (ESP, aimbot, triggerbot) for Source-motorn
;
; Alla nycklar ar frivilliga. Det som inte star har behaller vardet i koden.
; Varden som borjar med 0x ar hexadecimala. Farger skrivs som AARRGGBB.
;
; Offsets maste uppdateras efter varje spelpatch:
;   1) kor en offset-dumper (t.ex. cs2-dumper) mot samma spelversion
;   2) spara symbolerna som text, en per rad:
;          dwEntityList = 0x1F2A3B0
;          dwLocalPlayerPawn = 0x...
;          dwViewMatrix = 0x...
;          m_iHealth = 0x344
;   3) starta med  halcyon.exe --import offsets.txt
;   4) verifiera med  halcyon.exe --dump
; ---------------------------------------------------------------------------

[game]
process      = cs2.exe
window_title = Counter-Strike 2
window_class = SDL_app
module       = client.dll
; source1 = CS:GO-typ (pekarlista, 0x10-steg)
; source2 = CS2-typ     (chunk-tabell, 0x78-steg)
layout       = source2

[offsets]
; Absolut moduloffset eller signatur:  entity_list = sig:48 8B 0D ? ? ? ?
; Signaturen tolkas som mov/lea reg,[rip+disp] och ger adressen till variabeln.
entity_list   = 0
local_player  = 0
view_matrix   = 0

entity_stride = 0x78
max_entities  = 64

; Falt-offsets, samma namn som i en schema-dump.
m_ihealth     = 0
m_iteamnum    = 0
m_lifestate   = 0
m_vecorigin   = 0
m_vecoffset   = -1
m_bonematrix  = 0
bone_indirect = false
head_bone     = 6
m_dormant     = -1
m_bspotted    = -1

; Valfria. -1 = avstangt, elementet hoppas over i stallet for att gissa.
m_szname      = -1
m_weapon      = -1
m_armor       = -1
m_scoped      = -1
m_flashed     = -1
m_defusing    = -1
m_money       = -1
m_ammo        = -1
m_velocity    = -1
m_aimpunch    = -1
m_viewangles  = -1

[aim]
enabled         = true
key             = XBUTTON2
; false = hall inne knappen, true = vaxla med ett tryck
toggle          = false
; 0 huvud, 1 hals, 2 brost, 3 mage
hitbox          = 0
multi_hitbox    = false
hit_head        = true
hit_neck        = true
hit_chest       = true
hit_stomach     = false
; 0 narmast siktet, 1 kortast avstand, 3 lagst hp
priority        = 0
max_distance    = 0
team_check      = true
visible_only    = false
ignore_flashed  = false
only_scoped     = false

fov             = 120
dynamic_fov     = false
fov_min         = 40
fov_max         = 300
fov_scale       = 1.0

; 1 = omedelbart snapp, hogre = mjukare rorelse
smooth          = 8
; 0 linjar, 1 exponentiell, 2 linjar med humanisering
smooth_mode     = 2
humanize        = 0.15
humanize_jitter = 0.35
aim_step        = 0
; musklick per skarmpixel, finjustera mot din kanslighet
scale           = 1.0
reaction_time   = 0.06
reaction_jitter = 0.03

auto_fire       = false
auto_scope      = false

; rekylkompensering via m_aimpunch
rcs             = true
rcs_standalone  = false
rcs_x           = 0.85
rcs_y           = 0.85
rcs_smooth      = 4
rcs_scope_only  = false

prediction      = false
predict_ms      = 25

draw_fov        = true
fov_color       = FFB0B0B0
fov_alpha       = 0.35

[trigger]
enabled       = true
key           = ALT
toggle        = false
radius        = 10
max_distance  = 0
team_check    = true
; visible_only/wall_check kraver m_bspotted
visible_only  = false
wall_check    = false
only_scoped   = false
randomize     = true
delay_min_ms  = 8
delay_max_ms  = 26
hold_min_ms   = 8
hold_max_ms   = 18
burst         = false
burst_shots   = 3
burst_cooldown = 0.35

[esp]
enabled        = true
team_check     = true
max_distance   = 4000
fade_start     = 3000
box            = true
; 0 hel ruta, 1 horn
box_style      = 0
thickness      = 1.6
filled_box     = false
fill_color     = 22101010
health_bar     = true
; 0 vanster, 1 hoger, 2 ovanfor
health_bar_pos = 0
health_text    = false
armor_bar      = false
name           = true
weapon         = true
distance       = true
money          = false
ammo           = false
head_dot       = true
snapline       = true
; 0 botten, 1 toppen, 2 mitten
snapline_origin = 0
flags          = true
text_size      = 13

color_visible  = FF35FF6E
color_occluded = FFFF4040
color_snapline = 9035FF6E
color_text     = FFE8E8E8
color_health   = FF35FF6E
color_armor    = FF4DA6FF
color_head_dot = FFE8E8E8

[visuals]
; spel-FOV, anvands for att rakna om rekyl i grader till pixlar
fov               = 90
crosshair         = false
crosshair_style   = 0
crosshair_size    = 6
crosshair_gap     = 3
crosshair_thickness = 1
crosshair_color   = FF35FF6E
watermark         = true
keybind_list      = true
fps_counter       = false
time_counter      = false
accent            = FF7C4DFF
accent_dim        = 667C4DFF

[radar]
enabled      = false
size         = 180
zoom         = 1.0
pos_x        = 20
pos_y        = 20
rotate       = true
show_enemies = true
show_team    = false
dot_size     = 4
color_enemy  = FFFF4040
color_team   = FF35FF6E

[keys]
; menu finns reserverad men ritar ingen UI i den har builden
menu           = INSERT
quit           = END
esp_toggle     = F1
aim_toggle     = F2
trigger_toggle = F3
panic          = DELETE

[loop]
; 0 = obegransad
render_fps = 0
; hur ofta minnet las och aim/trigger utvarderas
aim_hz     = 500

[general]
; Presets appliceras vid start med  --preset rage  och skriver da over vardena
; ovan. Har ar nyckeln bara en etikett som visas i overlayen.
preset = custom

; ---------------------------------------------------------------------------
; Reserverade nycklar
;
; Laddaren kanner igen fler nycklar an de som star har: backtrack, resolver,
; silent, target_switch, ignore_smoke, no_flash, no_smoke, night_mode, skeleton,
; glow, hitmarker, spectator_list, bhop-relaterade flaggor och liknande.
; De ar avsiktligt utelamnade har: de kraver skrivningar till spelminnet eller
; hookar och har darfor ingen effekt i en extern, read-only klient.
; ---------------------------------------------------------------------------
