; ---------------------------------------------------------------------------
; halcyon - extern klient (ESP, aimbot, triggerbot) for Source-motorn
;
; Alla nycklar ar frivilliga. Det som inte star har behaller vardet i koden.
; Varden som borjar med 0x ar hexadecimala. Farger skrivs som AARRGGBB.
;
; Offsets maste uppdateras efter varje spelpatch:
;   1) kor en offset-dumper (t.ex. cs2-dumper) mot samma spelversion
;   2) spara symbolerna som text, en per rad:
;          dwEntityList = 0x1F2A3B0
;          dwLocalPlayerPawn = 0x...
;          dwViewMatrix = 0x...
;          m_iHealth = 0x344
;   3) starta med  halcyon.exe --import offsets.txt
;   4) verifiera med  halcyon.exe --dump
;
; Installningar anda till hoger: klicka pa overlayen och tryck INSERT (menyn),
; eller starta med  --preset rage / --preset legit  for en fardig profil.
; ---------------------------------------------------------------------------

[general]
; Etikett som visas i overlayen. CLI --preset skriver over hela profilgruppen.
preset = custom

[game]
process      = cs2.exe
window_title = Counter-Strike 2
window_class = SDL_app
module       = client.dll
; source1 = CS:GO-typ (pekarlista, 0x10-steg)
; source2 = CS2-typ     (chunk-tabell, 0x78-steg)
layout       = source2

[offsets]
; Absolut moduloffset eller signatur:  entity_list = sig:48 8B 0D ? ? ? ?
; Signaturen tolkas som mov/lea reg,[rip+disp] och ger adressen till variabeln.
entity_list   = 0
local_player  = 0
view_matrix   = 0

entity_stride = 0x78
max_entities  = 64

; Falt-offsets, samma namn som i en schema-dump.
m_ihealth     = 0
m_iteamnum    = 0
m_lifestate   = 0
m_vecorigin   = 0
m_vecoffset   = -1
m_bonematrix  = 0
bone_indirect = false
head_bone     = 6
m_dormant     = -1
m_bspotted    = -1

; Valfria. -1 = avstangt, elementet hoppas over i stallet for att gissa.
m_szname      = -1
m_weapon      = -1
m_armor       = -1
m_scoped      = -1
m_flashed     = -1
m_defusing    = -1
m_money       = -1
m_ammo        = -1
m_velocity    = -1
m_aimpunch    = -1
m_viewangles  = -1

[aim]
enabled         = true
key             = XBUTTON2
; false = hall inne knappen, true = vaxla med ett tryck
toggle          = false
; 0 huvud, 1 hals, 2 brost, 3 mage
hitbox          = 0
multi_hitbox    = false
hit_head        = true
hit_neck        = true
hit_chest       = true
hit_stomach     = false
; 0 narmast siktet, 1 kortast avstand, 2 minst fov, 3 lagst hp
priority        = 0
target_switch   = true
switch_delay    = 0.05
max_distance    = 0
team_check      = true
visible_only    = false
; Reserverade i en extern, read-only klient.
ignore_smoke    = false
ignore_flashed  = false
only_scoped     = false

fov             = 120
dynamic_fov     = false
fov_min         = 40
fov_max         = 300
fov_scale       = 1.0

; 1 = omedelbart snapp, hogre = mjukare rorelse
smooth          = 8
; 0 linjar, 1 exponentiell, 2 linjar med humanisering
smooth_mode     = 2
humanize        = 0.15
humanize_jitter = 0.35
aim_step        = 0
; musklick per skarmpixel, finjustera mot din kanslighet
scale           = 1.0
reaction_time   = 0.06
reaction_jitter = 0.03
first_shot_delay = 0

auto_fire       = false
auto_scope      = false
auto_pistol     = false
auto_stop       = false
auto_crouch     = false

; rekylkompensering via m_aimpunch
rcs             = true
rcs_standalone  = false
rcs_x           = 0.85
rcs_y           = 0.85
rcs_smooth      = 4
rcs_scope_only  = false

prediction      = false
predict_ms      = 25
; Backtrack ar en approximation fran klientens egen historik.
backtrack       = false
backtrack_ms    = 80
; 0 av, 1 statisk offset, 2 jitter
resolver        = 0

draw_fov        = true
fov_color       = FFB0B0B0
fov_alpha       = 0.35
; Reserverad: kraver skrivning till usercmds.
silent          = false

[trigger]
enabled        = true
key            = ALT
toggle         = false
radius         = 10
max_distance   = 0
team_check     = true
; visible_only/wall_check kraver m_bspotted
visible_only   = false
wall_check     = false
only_scoped    = false
randomize      = true
delay_min_ms   = 8
delay_max_ms   = 26
hold_min_ms    = 8
hold_max_ms    = 18
burst          = false
burst_shots    = 3
burst_delay    = 0.05
burst_cooldown = 0.35

[esp]
enabled        = true
team_check     = true
max_distance   = 4000
visible_check  = false
; true = rita bara spelare vars box ligger pa skarmen.
; Offscreen-pilar kraver att detta ar false.
oof_check      = true
fade_start     = 3000
box            = true
; 0 hel ruta, 1 horn, 2 3d
box_style      = 0
thickness      = 1.6
filled_box     = false
fill_color     = 22101010
health_bar     = true
; 0 vanster, 1 hoger, 2 ovanfor
health_bar_pos = 0
health_text    = false
armor_bar      = false
name           = true
weapon         = true
distance       = true
money          = false
ammo           = false
head_dot       = true
snapline       = true
; 0 botten, 1 toppen, 2 mitten
snapline_origin = 0
skeleton       = false
skeleton_thickness = 1.2
flags          = true
glow           = false
offscreen_arrows = false
; Reserverade: kraver ljud-/bombdata som inte exponeras utifran.
sound_esp      = false
sound_radius   = 800
bomb           = false
bomb_timer     = false
dropped_weapons = false
grenades       = false
local_player   = false
; 0 = automatiskt
text_size      = 0
outline_text   = true

color_visible  = FF35FF6E
color_occluded = FFFF4040
color_snapline = 9035FF6E
color_text     = FFE8E8E8
color_health   = FF35FF6E
color_armor    = FF4DA6FF
color_skeleton = FFE8E8E8
color_head_dot = FFE8E8E8
color_glow     = 8035FF6E

[visuals]
; Reserverade: kraver skrivning till kameran/spelminnet.
fov_changer       = false
fov               = 90
third_person      = false
third_person_dist = 120
no_scope          = false

crosshair         = false
; 0 kors, 1 punkt, 2 cirkel, 3 t
crosshair_style   = 0
crosshair_size    = 6
crosshair_gap     = 3
crosshair_thickness = 1
crosshair_color   = FF35FF6E

hitmarker         = false
hitmarker_size    = 12
hitmarker_color   = FFFFFFFF
damage_indicator  = false
spectator_list    = false

watermark         = true
keybind_list      = true
fps_counter       = false
ping_counter      = false
time_counter      = false

; Reserverade: kraver skrivning till spelminnet.
no_flash          = false
flash_alpha       = 0
no_smoke          = false
no_decals         = false
remove_hands      = false
; Night mode ritas av overlayen och fungerar utan skrivningar.
night_mode        = false
night_alpha       = 0.45

accent            = FF7C4DFF
accent_dim        = 667C4DFF

[radar]
enabled      = false
size         = 180
zoom         = 1.0
pos_x        = 20
pos_y        = 20
rotate       = true
show_enemies = true
show_team    = false
show_bomb    = true
show_dropped = false
dot_size     = 4
color_enemy  = FFFF4040
color_team   = FF35FF6E
color_bomb   = FFFFAA00

[misc]
bhop            = false
bhop_key        = SPACE
auto_strafe     = false
strafe_strength = 1.0
; Reserverade.
jump_bug        = false
edge_jump       = false
edge_jump_key   = NONE

auto_pistol     = false
auto_reload     = false
knife_bot       = false
; Reserverade: kraver speltillstand eller menyautomation.
auto_accept     = false
auto_defuse     = false
auto_buy        = false
auto_buy_text   =
fake_latency    = false
fake_latency_ms = 80

chat_spam       = false
chat_spam_text  = hx
chat_spam_delay = 2.0
kill_say        = false
kill_say_text   = nice
clan_tag        = false
clan_tag_text   = hx
anti_aim        = false
anti_aim_mode   = 0
auto_gg         = false
auto_molotov    = false
preserve_killfeed = false

[keys]
; INSERT oppnar ett vanligt instellningsfonster (WinForms), overlayen forblir klick-genomtradande.
menu           = INSERT
quit           = END
esp_toggle     = F1
aim_toggle     = F2
trigger_toggle = F3
panic          = DELETE

[loop]
; 0 = obegransad
render_fps = 0
; hur ofta minnet las och aim/trigger utvarderas
aim_hz     = 500
